<title>Nas Reader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: fixed library rail on the left, sticky search bar, shelves of covers; the reader is a full-screen dark overlay. */
:root {
  --bg: #0d0f14;
  --panel: #151821;
  --panel-2: #1c202c;
  --line: #272c3b;
  --fg: #eceef4;
  --muted: #8a90a6;
  --accent: #ffd23f;      /* process yellow */
  --accent-ink: #ffd23f;  /* accent used as text */
  --on-accent: #17140a;
  --dot: rgba(255, 210, 63, .10);
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  --ok: #3ccf8e;
  --warn: #f2994a;
  --bad: #ef5350;
  --display: "Big Shoulders Display", "Bahnschrift Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, "Cascadia Mono", monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef0f4; --panel: #ffffff; --panel-2: #f5f6f9; --line: #dde0e8; --fg: #151823; --muted: #5d6377;
    --accent: #ffd23f; --accent-ink: #8a6500; --on-accent: #17140a; --dot: rgba(23, 26, 38, .06);
    --shadow: 0 10px 26px rgba(30, 36, 60, .16); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef0f4; --panel: #ffffff; --panel-2: #f5f6f9; --line: #dde0e8; --fg: #151823; --muted: #5d6377;
  --accent: #ffd23f; --accent-ink: #8a6500; --on-accent: #17140a; --dot: rgba(23, 26, 38, .06);
  --shadow: 0 10px 26px rgba(30, 36, 60, .16); color-scheme: light;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 400 15px/1.45 var(--body); margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; border: 3px solid var(--bg); }

.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }

/* ---------- rail ---------- */
.rail {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; box-sizing: border-box;
  background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 18px; padding: 22px 14px 16px;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 0 8px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; flex: none; position: relative; background: var(--panel-2); overflow: hidden; }
.brand-mark::before, .brand-mark::after { content: ""; position: absolute; top: 8px; bottom: 8px; width: 9px; border-radius: 1px; }
.brand-mark::before { left: 7px; background: var(--accent); }
.brand-mark::after { right: 7px; background: #e83e3a; }
.brand b { font: 900 25px/0.9 var(--display); letter-spacing: .02em; text-transform: uppercase; display: block; }
.brand small { font: 400 11px var(--mono); color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.led { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
.led.off { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 22%, transparent); }
.led.busy { background: var(--accent); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .35; } }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font: 600 11px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 6px; }
.nav button {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  padding: 8px 10px; border-radius: 8px; color: var(--muted); font-weight: 500;
}
.nav button:hover { background: var(--panel-2); color: var(--fg); }
.nav button.on { background: var(--panel-2); color: var(--fg); }
.nav button.on .ico { color: var(--accent-ink); }
.nav .ico { width: 18px; height: 18px; flex: none; }
.nav .n { margin-left: auto; font: 400 11.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.nav .sub { padding-left: 18px; }
.nav .sub button { padding: 6px 10px; font-size: 14px; }
.pubdot { width: 9px; height: 9px; border-radius: 2px; flex: none; background: var(--pc); transform: rotate(45deg); margin: 0 4px; }

.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.scanbox { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font-size: 12.5px; color: var(--muted); }
.scanbox b { color: var(--fg); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.scanbox .path { font: 400 11px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; direction: rtl; text-align: left; }
.scanbox .meter { height: 3px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.scanbox .meter i { display: block; height: 100%; width: 40%; background: var(--accent); animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
.foot-row { display: flex; gap: 6px; }
.foot-row button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 8px; border-radius: 8px; color: var(--muted); font-size: 13px; border: 1px solid var(--line); }
.foot-row button:hover { color: var(--fg); background: var(--panel-2); }
.foot-row .ico { width: 16px; height: 16px; }

/* ---------- top bar ---------- */
.main { min-width: 0; display: flex; flex-direction: column; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px);
  display: flex; align-items: center; gap: 12px;
  padding-block: 14px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid transparent;
}
.top.scrolled { border-bottom-color: var(--line); }
.iconbtn { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); flex: none; }
.iconbtn:hover { background: var(--panel-2); color: var(--fg); }
.iconbtn .ico { width: 20px; height: 20px; }
.search { flex: 1; max-width: 640px; position: relative; }
.search input {
  width: 100%; box-sizing: border-box; height: 44px; border-radius: 11px;
  background: var(--panel); border: 1px solid var(--line); padding: 0 90px 0 44px; font-size: 15px; outline: none;
}
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.search input::placeholder { color: var(--muted); }
.search .ico { position: absolute; left: 14px; top: 12px; width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.search kbd { position: absolute; right: 12px; top: 11px; font: 500 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
.top .count { margin-left: auto; font: 400 12px var(--mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

.view { padding-block: 10px 60px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 40px; }
.update {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 16px; border-radius: 12px;
  background: color-mix(in srgb, var(--accent) 16%, var(--panel)); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
}
.update b { font-weight: 700; }
.update span { color: var(--muted); font-size: 13.5px; }
.update .btns { margin: 0 0 0 auto; }
.update .btn { padding: 8px 14px; font-size: 13.5px; }
.syncline { font: 400 12.5px var(--mono); color: var(--muted); }
.syncline.bad { color: var(--bad); }
.demo-note { font-size: 12.5px; color: var(--muted); border: 1px dashed var(--line); border-radius: 9px; padding: 8px 12px; align-self: flex-start; }
.demo-note b { color: var(--accent-ink); font-weight: 600; }

/* ---------- section headings ---------- */
.sec { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.sec-head h2 { font: 800 28px/1 var(--display); text-transform: uppercase; letter-spacing: .015em; margin: 0; text-wrap: balance; }
.sec-head .meta { font: 400 12px var(--mono); color: var(--muted); }
.sec-head .link { margin-left: auto; color: var(--muted); font-size: 13.5px; font-weight: 500; }
.sec-head .link:hover { color: var(--fg); }

/* ---------- hero (continue reading) ---------- */
.hero {
  position: relative; overflow: hidden; border-radius: 16px; border: 1px solid var(--line);
  background: var(--panel); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 30px; padding: 26px;
}
.hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(var(--dot) 1.6px, transparent 1.8px); background-size: 11px 11px;
  -webkit-mask-image: linear-gradient(100deg, transparent 30%, #000 100%); mask-image: linear-gradient(100deg, transparent 30%, #000 100%);
}
.hero .cover { width: 168px; border-radius: 6px; box-shadow: var(--shadow); }
.hero-body { position: relative; display: flex; flex-direction: column; gap: 10px; justify-content: center; min-width: 0; }
.eyebrow { font: 600 11.5px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--accent-ink); }
.hero h1 { font: 900 clamp(34px, 4.4vw, 58px)/.92 var(--display); text-transform: uppercase; margin: 0; text-wrap: balance; }
.hero .crumbs { color: var(--muted); font-size: 14px; }
.hero .prog { display: flex; align-items: center; gap: 12px; font: 400 12.5px var(--mono); color: var(--muted); max-width: 420px; }
.hero .prog .bar { flex: 1; height: 5px; border-radius: 5px; background: var(--line); overflow: hidden; }
.hero .prog .bar i { display: block; height: 100%; background: var(--accent); }
.btn { display: inline-flex; align-items: center; gap: 9px; padding: 11px 18px; border-radius: 10px; font-weight: 600; font-size: 14.5px; }
.btn .ico { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border: 1px solid var(--line); color: var(--fg); }
.btn.ghost:hover { background: var(--panel-2); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.hero-side { position: absolute; right: 26px; top: 26px; bottom: 26px; display: flex; gap: 14px; align-items: flex-end; }

/* ---------- universe tiles ---------- */
.unis { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.uni {
  position: relative; overflow: hidden; height: 148px; border-radius: 14px; text-align: left;
  background: linear-gradient(135deg, color-mix(in srgb, var(--pc) 92%, #000) 0%, color-mix(in srgb, var(--pc) 45%, #000) 100%);
  color: #fff; padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between;
  transition: transform .18s ease, box-shadow .18s ease;
}
.uni:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.uni::before {
  content: ""; position: absolute; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,.16) 1.5px, transparent 1.7px); background-size: 9px 9px;
  -webkit-mask-image: radial-gradient(circle at 85% 30%, #000, transparent 70%); mask-image: radial-gradient(circle at 85% 30%, #000, transparent 70%);
}
.uni b { position: relative; font: 900 40px/.88 var(--display); text-transform: uppercase; letter-spacing: .01em; max-width: 62%; text-wrap: balance; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.uni small { position: relative; font: 400 12px var(--mono); opacity: .85; }
.uni .fan { position: absolute; right: -6px; bottom: -26px; width: 130px; height: 150px; }
.uni .fan img, .uni .fan .ph { position: absolute; width: 78px; aspect-ratio: 2/3; object-fit: cover; border-radius: 4px; box-shadow: 0 6px 16px rgba(0,0,0,.45); background: #0003; }
.uni .fan > :nth-child(1) { right: 64px; bottom: 18px; transform: rotate(-12deg); }
.uni .fan > :nth-child(2) { right: 34px; bottom: 30px; transform: rotate(-3deg); }
.uni .fan > :nth-child(3) { right: 6px; bottom: 22px; transform: rotate(8deg); }

/* ---------- shelves & grids ---------- */
.shelf { display: grid; grid-auto-flow: column; grid-auto-columns: 152px; gap: 18px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
.shelf > * { scroll-snap-align: start; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 26px 18px; }
.grid.folders { grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); }

.card { display: flex; flex-direction: column; gap: 9px; text-align: left; min-width: 0; }
.card .cover { position: relative; aspect-ratio: 2/3; border-radius: 6px; overflow: hidden; background: var(--panel-2); box-shadow: 0 3px 10px rgba(0,0,0,.25); transition: transform .16s ease, box-shadow .16s ease; }
.card:hover .cover { transform: translateY(-4px); box-shadow: var(--shadow); }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover .fmt { position: absolute; top: 7px; left: 7px; font: 600 9.5px var(--mono); letter-spacing: .06em; padding: 3px 5px; border-radius: 4px; background: rgba(10,12,18,.78); color: #fff; }
.cover .done { position: absolute; top: 7px; right: 7px; font: 600 10px var(--body); padding: 3px 7px; border-radius: 20px; background: var(--ok); color: #06130d; }
.cover .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0,0,0,.55); }
.cover .bar i { display: block; height: 100%; background: var(--accent); }
.card .cap { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.card .cap b { font-weight: 600; font-size: 13.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.card .cap small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .cap .iss { font-family: var(--mono); color: var(--accent-ink); font-size: 11.5px; }

.folder .stack { position: relative; aspect-ratio: 4/3.6; }
.folder .stack > * { position: absolute; bottom: 0; width: 58%; aspect-ratio: 2/3; border-radius: 5px; object-fit: cover; box-shadow: 0 6px 16px rgba(0,0,0,.35); background: var(--panel-2); transition: transform .2s ease; }
.folder .stack > :nth-child(1) { left: 0; transform: rotate(-6deg); transform-origin: bottom left; }
.folder .stack > :nth-child(2) { left: 21%; z-index: 1; }
.folder .stack > :nth-child(3) { left: 42%; transform: rotate(6deg); transform-origin: bottom right; z-index: 2; }
.folder .stack > :only-child { left: 21%; transform: none; }
.folder:hover .stack > :nth-child(1) { transform: rotate(-10deg) translateX(-4px); }
.folder:hover .stack > :nth-child(3) { transform: rotate(10deg) translateX(4px); }
.folder .cap b { font-size: 14.5px; }

.more { justify-self: center; grid-column: 1 / -1; height: 1px; }

/* ---------- browse header ---------- */
.bhead { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 26px 0 6px; }
.crumbbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted); }
.crumbbar button:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
.crumbbar .sep { opacity: .5; }
.bhead h1 { display: flex; align-items: center; gap: 16px; font: 900 clamp(40px, 5.4vw, 72px)/.9 var(--display); text-transform: uppercase; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.bhead h1 .tab { width: 12px; align-self: stretch; border-radius: 3px; background: var(--pc); flex: none; }
.bhead .facts { display: flex; flex-wrap: wrap; gap: 8px 18px; font: 400 12.5px var(--mono); color: var(--muted); }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { padding: 7px 13px; border-radius: 30px; border: 1px solid var(--line); color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; }
.chip:hover { color: var(--fg); }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .n { font-family: var(--mono); font-size: 11px; opacity: .7; margin-left: 4px; }
.toolbar .spacer { flex: 1; }

/* ---------- search ---------- */
.hits-folders { display: flex; flex-wrap: wrap; gap: 8px; }
.hit-folder { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); text-align: left; max-width: 100%; }
.hit-folder:hover { border-color: var(--muted); }
.hit-folder img, .hit-folder .ph { width: 30px; height: 44px; border-radius: 3px; object-fit: cover; flex: none; background: var(--panel-2); }
.hit-folder b { font-weight: 600; font-size: 13.5px; display: block; }
.hit-folder small { color: var(--muted); font-size: 11.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
mark { background: color-mix(in srgb, var(--accent) 40%, transparent); color: inherit; border-radius: 2px; }

.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 70px 20px; color: var(--muted); }
.empty h2 { font: 800 32px/1 var(--display); text-transform: uppercase; color: var(--fg); margin: 0; }
.empty p { max-width: 460px; margin: 0; }
.bignum { font: 900 68px/1 var(--display); color: var(--accent-ink); font-variant-numeric: tabular-nums; }

/* ---------- stats strip ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stats button { padding: 16px 18px; text-align: left; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; }
.stats button:last-child { border-right: 0; }
.stats button:hover { background: var(--panel); }
.stats b { font: 800 30px/1 var(--display); font-variant-numeric: tabular-nums; }
.stats small { color: var(--muted); font-size: 12.5px; }

/* ---------- settings ---------- */
.form { display: flex; flex-direction: column; gap: 22px; max-width: 760px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field > .lbl { font-weight: 600; font-size: 14px; }
.field .hint { color: var(--muted); font-size: 13px; margin: 0; }
.txt { height: 40px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); padding: 0 12px; outline: none; box-sizing: border-box; width: 100%; }
.txt:focus { border-color: var(--accent); }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.check { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); font-size: 14px; cursor: pointer; min-width: 0; }
.check span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 14px; z-index: 100; box-shadow: var(--shadow); }

/* ---------- menu ---------- */
.menu { position: fixed; z-index: 60; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 5px; min-width: 230px; }
.menu button { display: flex; width: 100%; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 7px; font-size: 14px; text-align: left; }
.menu button:hover { background: var(--panel-2); }
.menu .ico { width: 16px; height: 16px; color: var(--muted); }

/* ---------- reader ---------- */
.reader { position: fixed; inset: 0; z-index: 50; background: #08090c; color: #eceef4; display: flex; flex-direction: column; user-select: none; }
.reader .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.reader .stage.fit-width { overflow-y: auto; align-items: flex-start; }
.reader .stage.scroll { overflow-y: auto; flex-direction: column; justify-content: flex-start; align-items: center; gap: 4px; padding: 60px 0 90px; box-sizing: border-box; }
.reader .spread { display: flex; height: 100%; width: 100%; align-items: center; justify-content: center; gap: 0; }
.reader .spread.rtl { flex-direction: row-reverse; }
.reader .spread img { max-height: 100%; max-width: 100%; object-fit: contain; display: block; min-width: 0; }
.reader .spread.two img { max-width: 50%; }
.reader .stage.fit-width .spread { height: auto; align-items: flex-start; }
.reader .stage.fit-width .spread img { max-height: none; width: 100%; max-width: 1400px; }
.reader .stage.fit-width .spread.two img { width: 50%; }
.reader .stage.scroll img { width: min(100%, 980px); display: block; min-height: 300px; background: #111; }
.reader .stage.scroll img[src] { min-height: 0; background: none; }
.reader .zone { position: absolute; top: 0; bottom: 0; width: 30%; z-index: 2; cursor: pointer; }
.reader .zone.l { left: 0; } .reader .zone.r { right: 0; }
.reader .stage.scroll ~ .zone { display: none; }

/** Books started but not finished, most recent first. */
function inProgress() {
  return S.visible.map(b => ({ b, p: progOf(b) })).filter(x => x.p && !isDone(x.p)).sort((a, b) => b.p.updated - a.p.updated);
}
/** For each series you have been reading: the next book after the last one you finished. */
function upNext() {
  const nodes = new Map();
  for (const b of S.visible) {
    const p = progOf(b); if (!p) continue;
    const n = nodeOf(b); if (!n) continue;
    const cur = nodes.get(n);
    if (!cur || p.updated > cur) nodes.set(n, p.updated);
  }
  const out = [];
  for (const [n, updated] of nodes) {
    let last = -1;
    n.books.forEach((b, i) => { if (progOf(b)) last = i; });
    if (last < 0 || !isDone(progOf(n.books[last]))) continue;
    const next = n.books.slice(last + 1).find(b => !progOf(b));
    if (next) out.push({ b: next, updated });
  }
  return out.sort((a, b) => b.updated - a.updated);
}
function listBooks(l) {
  const seen = new Set(), out = [];
  for (const id of S.lists[l] || []) {
    let b = S.byId[id]; if (!b) continue;
    if (b.dupOf) b = S.byId[b.dupOf];
    if (!seen.has(b.id)) { seen.add(b.id); out.push(b); }
  }
  return out;
}

function subtreeBooks(node) { const out = []; const visit = n => { out.push(...n.books); n.list.forEach(visit); }; visit(node); return out; }

function searchBooks(q) {
  const toks = norm(q).split(" ").filter(Boolean);
  if (!toks.length) return { books: [], folders: [] };
  const books = S.visible.filter(b => (!S.filterKind || b.kind === S.filterKind) && toks.every(t => b.hay.includes(t)));
  const folders = [];
  const visit = n => {
    if (n.path.length && toks.every(t => norm(n.label + " " + n.path.join(" ")).includes(t)) && toks.some(t => norm(n.label).includes(t))) folders.push(n);
    n.list.forEach(visit);
  };
  Object.entries(S.trees).forEach(([k, t]) => { if (!S.filterKind || k === S.filterKind) visit(t); });
  folders.sort((a, b) => a.path.length - b.path.length || b.count - a.count);
  // title matches first, then the rest
  books.sort((a, b) => (norm(a.display).includes(toks[0]) ? 0 : 1) - (norm(b.display).includes(toks[0]) ? 0 : 1) || (a.key < b.key ? -1 : 1));
  return { books, folders };
}
function renderSearch(v) {
  const q = $("#q").value.trim();
  const { books, folders } = searchBooks(q);
  const toks = norm(q).split(" ").filter(Boolean);
  const counts = {}; S.visible.forEach(b => { if (toks.every(t => b.hay.includes(t))) counts[b.kind] = (counts[b.kind] || 0) + 1; });
  const total = Object.values(counts).reduce((a, n) => a + n, 0);
  v.insertAdjacentHTML("beforeend", `<section class="bhead">
    <div class="crumbbar">Recherche</div>
    <h1>« ${esc(q)} »</h1>
    <div class="toolbar">
      <button class="chip ${!S.filterKind ? "on" : ""}" data-kind="">Tout<span class="n">${fmtN(total)}</span></button>
      ${Object.keys(KINDS).filter(k => counts[k]).map(k => `<button class="chip ${S.filterKind === k ? "on" : ""}" data-kind="${k}">${KINDS[k].label}<span class="n">${fmtN(counts[k])}</span></button>`).join("")}
    </div></section>`);
  if (!books.length && !folders.length) {
    v.insertAdjacentHTML("beforeend", `<div class="empty"><h2>Rien trouvé</h2><p>Aucun titre ni dossier ne contient « ${esc(q)} ». Essaie un nom de héros, d'auteur, de dessinateur ou un numéro comme #666.</p></div>`);
    return;
  }
  if (folders.length) {
    v.insertAdjacentHTML("beforeend", `<section class="sec"><div class="sec-head"><h2>Séries & dossiers</h2><span class="meta">${fmtN(folders.length)}</span></div>
      <div class="hits-folders">${folders.slice(0, 40).map(n => `<button class="hit-folder" data-folder="${esc(JSON.stringify([n.kind, n.path]))}">
        ${coverImg(firstBooks(n, 1)[0])}<span><b>${esc(n.label)}</b><small>${esc([KINDS[n.kind].label, ...n.path.slice(0, -1).map(cleanName)].join(" › "))} · ${fmtN(n.count)}</small></span></button>`).join("")}</div></section>`);
  }
  if (books.length) {
    const sec = document.createElement("section"); sec.className = "sec";
    sec.innerHTML = `<div class="sec-head"><h2>Titres</h2><span class="meta">${fmtN(books.length)}</span></div>`;
    const grid = document.createElement("div"); grid.className = "grid"; sec.append(grid); v.append(sec);
    chunked(grid, books, b => bookCard(b), 120);
  }
}

function showSheet(id) {
  const b = S.byId[id]; if (!b) return;
  closeMenu(); $("#sheet")?.remove();
  const m = b.meta || {};
  const p = progOf(b);
  const node = nodeOf(b);
  const vs = versions(b);
  const rows = [
    ["Série", m.series || cleanName(b.crumbs[b.crumbs.length - 1] || "")],
    ["Numéro", m.number ? (m.volume ? `Vol. ${m.volume} · ` : "") + "#" + m.number : null],
    [b.kind === "ebook" ? "Auteur" : "Scénario", m.writer || b.author],
    ["Dessin", m.artist],
    ["Année", m.year],
    ["Éditeur", m.publisher],
    ["Genre", m.genre],
    ["Personnages", m.characters],
    ["Pages", m.pageCount || (p && p.pages > 1 && p.pages !== 1000 ? p.pages : null)],
    ["Fichier" + (vs.length > 1 ? "s" : ""), vs.map(v => `${v.fmt.toUpperCase()} · ${bytes(v.size)}`).join("  /  ")],
  ].filter(r => r[1]);
  const fav = inList("favorites", b), later = inList("toread", b);
  const pct = p ? Math.round(100 * (p.page + 1) / p.pages) : 0;
  const bg = document.createElement("div"); bg.className = "sheet-bg"; bg.id = "sheet";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(b.display)}">
    <button class="iconbtn" data-sheet="close" title="Fermer (Échap)">${ico("close")}</button>
    <div><img class="cover-lg" alt="" data-cover="${b.id}"></div>
    <div class="body">
      <div class="eyebrow">${esc([KINDS[b.kind].label, ...b.crumbs.slice(0, -1).map(cleanName)].join(" › "))}</div>
      <h2>${esc(b.display)}</h2>
      ${b.subtitle ? `<div class="subtitle">${esc(b.subtitle)}</div>` : ""}
      ${p ? `<div class="prog"><span class="bar"><i style="width:${isDone(p) ? 100 : pct}%"></i></span>${isDone(p) ? "Lu" : p.pages === 1000 && p.loc ? Math.round(p.page / 10) + " %" : `page ${p.page + 1} / ${p.pages}`}</div>` : ""}
      <div class="btns" style="margin-top:0">
        <button class="btn primary" data-sheet="read">${ico("play")}${p && !isDone(p) ? "Continuer" : "Lire"}</button>
        <button class="btn ghost toggle ${fav ? "on" : ""}" data-sheet="fav">${ico(fav ? "heart-f" : "heart")}${fav ? "Favori" : "Ajouter aux favoris"}</button>
        <button class="btn ghost toggle ${later ? "on" : ""}" data-sheet="toread">${ico("bookmark")}${later ? "Dans « À lire »" : "À lire"}</button>
      </div>
      ${m.summary ? `<p class="summary">${esc(m.summary)}</p>` : ""}
      <dl>${rows.map(([k, val]) => `<dt>${k}</dt><dd>${esc(val)}</dd>`).join("")}
        ${APP ? `<dt>Emplacement</dt><dd class="mono">${esc(b.path)}</dd>` : ""}</dl>
      ${vs.length > 1 ? `<div class="vers">${vs.map(v => `<button class="btn ghost" data-sheet="open" data-v="${v.id}">${ico("play")}Lire la version ${v.fmt.toUpperCase()}</button>`).join("")}</div>` : ""}
      <div class="btns" style="margin-top:0">
        ${p ? `<button class="btn ghost" data-sheet="unread">${ico("undo")}Marquer comme non lu</button>` : `<button class="btn ghost" data-sheet="done">${ico("check")}Marquer comme lu</button>`}
        ${node ? `<button class="btn ghost" data-sheet="series">${ico("folder")}Voir la série</button>` : ""}
        ${DESKTOP ? `<button class="btn ghost" data-sheet="reveal">${ico("folder")}Explorateur</button>` : ""}
      </div>
    </div></div>`;
  document.body.append(bg);
  hydrate(bg);
  bg.querySelector("[data-sheet=read]").focus();
  bg.addEventListener("click", async e => {
    if (e.target === bg) return bg.remove();
    const a = e.target.closest("[data-sheet]")?.dataset.sheet; if (!a) return;
    if (a === "close") return bg.remove();
    if (a === "read") { bg.remove(); return openBook(b.id); }
    if (a === "open") { bg.remove(); return openBook(e.target.closest("[data-v]").dataset.v, true); }
    if (a === "series") { bg.remove(); return go({ view: "browse", kind: b.kind, path: b.crumbs }); }

    if (a === "toread") toggleList("toread", b);
    if (a === "done") markRead([b], true);
    if (a === "unread") markRead([b], false);
    showSheet(b.id); refresh();
  });
}

/** Marks books (and all their versions) as read or unread. */
function markRead(books, read) {
  const ids = books.flatMap(versions).map(v => v.id);
  const now = Date.now();
  if (read) {
    const items = books.map(b => {
      const cur = progOf(b);
      return { id: b.id, page: cur && cur.pages > 1 ? cur.pages - 1 : 0, pages: cur && cur.pages > 1 ? cur.pages : 1 };
    });
    items.forEach(i => { S.progress[i.id] = { page: i.page, pages: i.pages, loc: null, updated: now }; });
    if (APP) post("/api/progress-batch", items).catch(() => toast("La progression n'a pas pu être enregistrée"));
  } else {

/** Opens a book. Unless `exact`, picks the version you were reading (or the best format). */
async function openBook(id, exact = false) {
  let b = S.byId[id]; if (!b) return;
  if (!exact) {
    const main = b.dupOf ? S.byId[b.dupOf] : b;
    let best = null;
    for (const v of versions(main)) { const p = S.progress[v.id]; if (p && (!best || p.updated > best.p.updated)) best = { v, p }; }
    b = best ? best.v : main;
  }
  closeMenu(); $("#sheet")?.remove();
  if (b.fmt === "epub") return openEpub(b);
  const el = readerShell(b);
  if (b.fmt === "mobi" || b.fmt === "azw3") return readerError(`Le format ${b.fmt.toUpperCase()} (Kindle) ne s'affiche pas dans Nas Reader. Ouvre-le avec Calibre ou l'application Kindle.`, b);
  try {
    R.pages = APP ? (await api(`/api/book/${b.id}/open`)).pages : S.progress[b.id]?.pages || 18 + (hash(b.id) % 14);
  } catch (e) { return readerError(e.message, b); }
  if (R.el !== el) return;
  el.querySelector(".rload").remove();
  R.rtl = b.kind === "manga" ? store.get("rtlManga", true) : false;
  R.dims = {}; R.zoom = 1; R.loupe = false; R.prefetched = false;
  const p = S.progress[b.id];
  R.i = p && !isDone(p) && p.pages === R.pages ? p.page : 0;
  R.next = () => turn(1); R.prev = () => turn(-1);
  buildBars(); drawPages();
}
const pageSrc = i => APP ? `/api/book/${R.book.id}/page/${i}` : fakePage(R.book, i);
const isWide = i => { const d = R.dims[i]; return d && d.w > d.h * 1.05; };

  if (i + 1 < R.pages && !isWide(i + 1)) return [i, i + 1];
  return [i];
}
function turn(dir) {
  if (RS.mode === "scroll") {
    const t = Math.max(0, Math.min(R.pages - 1, R.i + dir)); jump(t); return;
  }
  if (dir > 0) {
    const n = R.i + spreadAt(R.i).length;
    if (n >= R.pages) return showEnd();
    R.i = n;
  } else {
    if (R.el.querySelector(".endcard")) { R.el.querySelector(".endcard").remove(); return; }
    if (R.i === 0) return;
    let j = R.i - 1;
    if (RS.mode === "double" && j > 0 && !isWide(j) && j - 1 >= 1 && !isWide(j - 1)) j--;
    R.i = j;
  }

}
function jump(i) {

  else drawPages();
}
function saveR() { setProgress(R.book, R.i + spreadAt(R.i).length - 1, R.pages, null); }
function nextInSeries(b) {
  const node = nodeOf(b.dupOf ? S.byId[b.dupOf] : b); const list = node ? node.books : [];
  const i = list.findIndex(x => x.id === b.id || x.id === b.dupOf);
  return i >= 0 ? list[i + 1] : null;
}

function drawPages() {
  const st = R.el.querySelector(".stage");
  R.el.querySelector(".endcard")?.remove();
  st.className = "stage" + (RS.mode === "scroll" ? " scroll" : RS.fit === "width" ? " fit-width" : "");
  if (RS.mode === "scroll") {
    R.zoom = 1;
    st.innerHTML = Array.from({ length: R.pages }, (_, i) => `<img alt="Page ${i + 1}" data-p="${i}">`).join("");
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { const im = e.target; if (!im.src) im.src = pageSrc(+im.dataset.p); }
    }), { root: st, rootMargin: "1500px" });
    const cur = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { R.i = +e.target.dataset.p; updateBars(); saveR(); prefetchNext(); }
    }), { root: st, rootMargin: "-45% 0px -45% 0px" });
    $$("img", st).forEach(im => { io.observe(im); cur.observe(im); });
    requestAnimationFrame(() => st.querySelectorAll("img")[R.i]?.scrollIntoView({ block: "start" }));
  } else {
    const idx = spreadAt(R.i);
    st.innerHTML = `<div class="spread ${idx.length > 1 ? "two" : ""} ${R.rtl ? "rtl" : ""}">${idx.map(i => `<img alt="Page ${i + 1}" data-p="${i}" src="${pageSrc(i)}" draggable="false">`).join("")}</div>`;
    $$("img", st).forEach(im => im.addEventListener("load", () => {

    for (let k = 1; k <= 4; k++) { const n = R.i + idx.length - 1 + k; if (n < R.pages) { const im = new Image(); im.onload = () => { R.dims[n] = { w: im.naturalWidth, h: im.naturalHeight }; }; im.src = pageSrc(n); } }

  }

}

/* ---- zoom & loupe ---- */
function applyZoom(anchor) {
  const st = R.el?.querySelector(".stage"); if (!st || RS.mode === "scroll") return;
  const imgs = $$(".spread img", st);
  const zoomed = R.zoom > 1.001;
  const before = zoomed && anchor && st.classList.contains("zoomed")
    ? { x: (st.scrollLeft + anchor.x) / st.scrollWidth, y: (st.scrollTop + anchor.y) / st.scrollHeight } : null;
  const firstRect = anchor && !before && imgs[0] ? imgs[0].getBoundingClientRect() : null;
  st.classList.toggle("zoomed", zoomed);
  if (!zoomed) { imgs.forEach(im => { im.style.width = im.style.height = ""; }); updateZoom(); return; }
  const W = st.clientWidth / Math.max(1, imgs.length), H = st.clientHeight;
  imgs.forEach(im => {
    const ar = (im.naturalWidth || 2) / (im.naturalHeight || 3);
    let w, h;
    if (RS.fit === "width") { w = Math.min(W, 1400); h = w / ar; }
    else { h = H; w = h * ar; if (w > W) { w = W; h = w / ar; } }
    im.style.width = Math.round(w * R.zoom) + "px"; im.style.height = Math.round(h * R.zoom) + "px";
  });
  if (before) {
    st.scrollLeft = before.x * st.scrollWidth - anchor.x; st.scrollTop = before.y * st.scrollHeight - anchor.y;
  } else if (anchor && firstRect) {
    // From unzoomed: keep the clicked spot of the page under the cursor.
    const sr = st.getBoundingClientRect();
    const fx = (anchor.x + sr.left - firstRect.left) / firstRect.width, fy = (anchor.y + sr.top - firstRect.top) / firstRect.height;
    const nr = imgs[0].getBoundingClientRect();
    st.scrollLeft += nr.left - sr.left + fx * nr.width - anchor.x;
    st.scrollTop += nr.top - sr.top + fy * nr.height - anchor.y;
  }
  updateZoom();
}
function setZoom(z, anchor) {
  if (!R.el || R.epub || RS.mode === "scroll") return;
  R.zoom = Math.max(1, Math.min(5, Math.round(z * 100) / 100));
  applyZoom(anchor);
}
function updateZoom() { const zv = R.el?.querySelector(".zoomval"); if (zv) zv.textContent = Math.round(R.zoom * 100) + " %"; }
function stageAnchor(e) { const r = R.el.querySelector(".stage").getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

function moveLoupe(e) {

  const img = $$(".stage img", R.el).find(im => { const r = im.getBoundingClientRect(); return im.src && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom; });
  if (!img) { if (lp) lp.hidden = true; return; }
  if (!lp) { lp = document.createElement("div"); lp.className = "loupe"; R.el.append(lp); }
  const r = img.getBoundingClientRect(), M = 2.6, half = 140;
  lp.hidden = false;
  lp.style.left = e.clientX + "px"; lp.style.top = e.clientY + "px";
  lp.style.backgroundImage = `url("${img.src}")`;
  lp.style.backgroundSize = `${r.width * M}px ${r.height * M}px`;

/** Zoom by double-click, pan by dragging, loupe follows the mouse. */
function bindStage(el) {
  const st = el.querySelector(".stage");
  let drag = null;
  st.addEventListener("dblclick", e => { if (R.epub) return; setZoom(R.zoom > 1 ? 1 : 2.5, stageAnchor(e)); });
  st.addEventListener("mousedown", e => {
    if (e.button !== 0 || R.zoom <= 1) return;

  });
  addEventListener("mousemove", e => {
    if (drag && R.el === el) { st.scrollLeft = drag.l - (e.clientX - drag.x); st.scrollTop = drag.t - (e.clientY - drag.y); }
  });
  addEventListener("mouseup", () => { drag = null; st.classList.remove("drag"); });
  el.addEventListener("mousemove", e => { if (R.loupe) moveLoupe(e); });

  // Touch: swipe to turn pages, pinch to zoom.
  let touch = null, pinch = null;

    if (R.epub) return;
    if (e.touches.length === 2 && RS.mode !== "scroll") {

    } else if (e.touches.length === 1 && !pinch) touch = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };

    e.preventDefault();

  el.addEventListener("touchend", e => {
    if (pinch) { if (!e.touches.length) pinch = null; return; }
    if (!touch || R.zoom > 1 || RS.mode === "scroll" || R.epub || e.target.closest(".rbar")) { touch = null; return; }
    const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;

function onKey(e) {
  if (R.el) {
    const k = e.key;
    const fwd = R.rtl ? "ArrowLeft" : "ArrowRight", bwd = R.rtl ? "ArrowRight" : "ArrowLeft";
    if (k === "Escape") { if (document.fullscreenElement) return; closeReader(); }
    else if (k === fwd || k === "PageDown" || (k === " " && RS.mode !== "scroll" && !e.shiftKey)) { e.preventDefault?.(); R.next?.(); }
    else if (k === bwd || k === "PageUp" || (k === " " && e.shiftKey)) { e.preventDefault?.(); R.prev?.(); }
    else if (k === "Home" && !R.epub) jump(0);
    else if (k === "End" && !R.epub) jump(R.pages - 1);
    else if (k === "f" || k === "F") readerAction("full");
    else if (!R.epub && (k === "s" || k === "S")) readerAction("mode", { dataset: { v: "single" } });
    else if (!R.epub && (k === "d" || k === "D")) readerAction("mode", { dataset: { v: "double" } });
    else if (!R.epub && (k === "w" || k === "W")) readerAction("mode", { dataset: { v: "scroll" } });
    else if (!R.epub && (k === "z" || k === "Z")) readerAction("fit", { dataset: { v: RS.fit === "height" ? "width" : "height" } });
    else if (!R.epub && (k === "r" || k === "R")) readerAction("rtl");
    else if (!R.epub && (k === "t" || k === "T")) readerAction("thumbs");
    else if (!R.epub && (k === "l" || k === "L")) toggleLoupe();
    else if (!R.epub && (k === "+" || k === "=")) setZoom(R.zoom * 1.25);
    else if (!R.epub && (k === "-" || k === "_")) setZoom(R.zoom / 1.25);
    else if (!R.epub && k === "0") setZoom(1);
    return;
  }
  if ((e.ctrlKey && e.key.toLowerCase() === "k") || (e.key === "/" && document.activeElement !== $("#q"))) { e.preventDefault(); $("#q").focus(); $("#q").select(); }
  else if (e.key === "Escape" && $("#sheet")) $("#sheet").remove();
  else if (e.key === "Enter" && e.target.matches?.(".card[data-book]")) openBook(e.target.dataset.book);
  else if (e.key === "Escape") { closeMenu(); if (document.activeElement === $("#q")) { $("#q").value = ""; $("#q").blur(); if (S.route.view === "search") back(); } }
  else if (e.altKey && e.key === "ArrowLeft") back();
}

  try {

    if (rescanned && !polling) { await loadLibrary(); await reloadUserData(); if (!R.el && !$("#sheet")) refresh(); }
    const v = st.sync?.version;

async function pollStatus() {
  if (polling) return; polling = true;
  let wasScanning = false, lastMeta = Date.now();
  try {
    while (true) {
      try { S.status = await api("/api/status"); S.online = !S.status.error; }
      catch { S.online = false; }
      if (S.status.scanning) wasScanning = true;
      else if (wasScanning) { wasScanning = false; await loadLibrary(); render(); }
      if (!S.status.scanning && !S.status.enriching) break;
      if (!S.status.scanning && Date.now() - lastMeta > 20000) { lastMeta = Date.now(); await reloadMeta(); }
      if (!S.books.length && S.route.view !== "settings") render(); else renderRail();
      await new Promise(r => setTimeout(r, S.status.scanning ? 1200 : 3000));
    }
    if (wasScanning) { await loadLibrary(); render(); }
    else { await reloadMeta(); renderRail(); }
  } finally { polling = false; }
}

    "Ebooks": { "Freida McFadden": { "The Housemaid": ["The Housemaid 01-The Housemaid -- McFadden, Freida -- 2022 -- Bookouture", "The Housemaid 02-The Housemaid's Secret -- McFadden, Freida -- 2023 -- Bookouture", "The Housemaid 03-The Housemaid Is Watching -- McFadden, Freida -- 2024 -- Bookouture"] }, "Holly Jackson": ["Pour Pip -- Holly Jackson", "Pour Pip 2 -- Holly Jackson"], "Ian Rankin": ["Rebus - L'étrangleur d'Édimbourg -- Ian Rankin"], "Al Sweigart": ["Automate the Boring Stuff with Python -- Al Sweigart"], "Gérard Swinnen": ["Apprendre à programmer avec Python 3 -- Gérard Swinnen"], "Rebecca Yarros": ["Fourth Wing -- Rebecca Yarros", "Iron Flame -- Rebecca Yarros"] },
    "Magazines": { "Linux Magazine": 8, "Science & Vie": 10, "Programmez!": 6, "Hackable": 5, "Cahiers du Cinéma": 4, "National Geographic": 6 },
  };
  const books = []; let t0 = Date.now() - 864e5 * 400;
  const add = (kind, crumbs, title, fmt) => books.push({ id: (hash(crumbs.join("/") + title) >>> 0).toString(16), path: "", title, kind, fmt, size: 18e6 + (hash(title) % 30e6), mtime: t0 += 3.6e6 * (hash(title) % 90), crumbs });
  const series = (kind, crumbs, v, fmtFor) => {
    if (Array.isArray(v)) v.forEach(t => add(kind, crumbs, t, fmtFor(t)));
    else if (typeof v === "number") for (let i = 1; i <= v; i++) { const s = crumbs[crumbs.length - 1]; add(kind, crumbs, kind === "manga" ? `${s} T${String(i).padStart(2, "0")}` : kind === "magazine" ? `${s} n°${200 + i * 3}` : `${s} #${String(i).padStart(3, "0")}`, fmtFor(s + i)); }
    else for (const [k, sub] of Object.entries(v)) series(kind, [...crumbs, k], sub, fmtFor);
  };
  const cfmt = s => ["cbr", "cbr", "cbr", "cbz", "pdf"][hash(s) % 5];
  series("comic", [], T.Comics, cfmt);
  series("manga", [], T.Mangas, s => hash(s) % 3 ? "cbz" : "cbr");
  series("ebook", [], T.Ebooks, () => "epub");
  series("magazine", [], T.Magazines, () => "pdf");
  books.forEach(b => { b.sorted = true; });
  ["Formation", "Downloads"].forEach(sh => ["Guide Synology DSM 7", "Réseau domestique - mémo", "Python avancé - support de cours"].forEach(t => add("pdf", [sh], t, "pdf")));
  // Unsorted copies, as found in the Script and Downloads shares: they get grouped with the originals.
  const strange = "Docteur.Strange.(L'intégrale).Comics.Int09.(1981-1983).Fr";
  add("comic", ["Script", `00   ${strange}.CBR`], "Docteur.Strange.Int09.(1981-1983)", "cbr");
  add("comic", ["Script", `00   ${strange}.PDF`], "Docteur.Strange.Int09.(1981-1983)", "pdf");
  add("comic", ["Downloads"], "4. Amazing Spider-Man#669", "cbr");
  const BS = String.fromCharCode(92);
  books.forEach(b => { b.sorted ??= false; b.path = BS + BS + ["lord_of_adam", ...(b.sorted ? ["Comics Mangas Livre", b.kind === "comic" ? "Comics" : ""] : []), ...b.crumbs, b.title + "." + b.fmt].filter(Boolean).join(BS); });
  return books;
}

async function boot() {
  const th = store.get("theme", null); if (th) document.documentElement.dataset.theme = th;
  if (!APP) {
    const raw = demoLibrary();
    raw.filter(b => b.crumbs.includes("Amazing Spider-Man")).forEach(b => {
      const n = (b.title.match(/#(\d+)/) || [])[1];
      S.meta[b.id] = { series: "The Amazing Spider-Man", number: n, volume: (b.title.match(/V(\d)/) || [])[1], year: b.title.includes("V4") ? "2016" : b.title.includes("V3") ? "2014" : "2011", writer: "Dan Slott", artist: "Humberto Ramos", publisher: "Marvel", summary: "Exemple de résumé : dans l'application, ce texte vient de la fiche ComicInfo.xml rangée dans le CBZ ou le CBR.", pageCount: 24 };
    });
    S.books = raw.map(enrich); buildTrees();
    S.lists = store.get("demoLists", null) || { favorites: S.books.filter(b => b.crumbs.includes("Batman - Killing Joke") || b.crumbs.includes("Daredevil - Born Again")).map(b => b.id), toread: S.books.filter(b => b.crumbs.includes("Immortal Hulk")).slice(0, 3).map(b => b.id) };
    S.status = { scanning: false, scannedAt: Date.now() - 36e5 * 3, found: S.books.length };
    S.progress = store.get("demoProgress", null) || (() => {
      const pick = t => S.books.find(b => b.title === t || b.display === t);
      const out = {}; const now = Date.now();
      const a = pick("Amazing Spider-Man#669"); if (a) out[a.id] = { page: 11, pages: 24, updated: now };
      const d = S.books.find(b => b.crumbs.includes("Death Note")); if (d) out[d.id] = { page: 40, pages: 190, updated: now - 864e5 };
      const k = S.books.find(b => b.crumbs.includes("Batman - La Cour des Hiboux")); if (k) out[k.id] = { page: 8, pages: 22, updated: now - 864e5 * 2 };
      S.books.filter(b => b.crumbs.includes("Moon Knight (2021)")).slice(0, 3).forEach((b, i) => { out[b.id] = { page: 21, pages: 22, updated: now - 864e5 * (6 + i) }; });
      return out;
    })();
    render(); return;
  }
  try {
    const [, ud, st] = await Promise.all([loadLibrary(), api("/api/userdata"), api("/api/status")]);
    S.progress = ud.progress || {}; S.lists = { favorites: [], toread: [], ...ud.lists };
    S.status = { ...S.status, ...st }; S.online = !st.error;
  } catch (e) { S.online = false; }
  api("/api/settings").then(d => { S.nas = d.settings.nas; renderRail(); }).catch(() => { });
  render();
  if (S.status.scanning || S.status.enriching) pollStatus();
  lastSyncVersion = S.status.sync?.version ?? null;
  setInterval(watch, 30000);
}
/** Android back button: close what is on top, then go back, then leave the app. */
window.nasBack = () => {
  if ($("#menu")) { closeMenu(); return true; }
  if ($("#sheet")) { $("#sheet").remove(); return true; }
  if (R.el) { closeReader(); return true; }
  if (document.activeElement === $("#q") && $("#q").value) { $("#q").value = ""; $("#q").blur(); if (S.route.view === "search") back(); return true; }
  if (S.stack.length) { back(); return true; }
  return false;
};
boot();
</script>
